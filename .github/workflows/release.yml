name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Package source
        run: git archive --format=zip --prefix=ArabicPlural/ -o ArabicPlural-${{ github.ref_name }}.zip HEAD
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" ArabicPlural-*.zip \
            --title "ArabicPlural $GITHUB_REF_NAME" \
            --generate-notes
