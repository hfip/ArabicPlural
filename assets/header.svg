<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="ArabicPlural: the three Arabic plural forms that are usually wrong">
  <title>ArabicPlural: the three Arabic plural forms that are usually wrong</title>
  <rect width="1280" height="300" fill="#fbf3e4"/>
  <rect width="1280" height="6" fill="#0f766e"/>

  <text x="64" y="80" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="600" fill="#1c1917">Arabic<tspan fill="#0f766e">Plural</tspan></text>
  <text x="64" y="116" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="19" fill="#57534e">ستّ صيغ، لا صيغتان</text>
  <text x="64" y="146" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#8a7f6b">CLDR plural rules for Swift. No dependencies.</text>

  <text x="64" y="208" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.6" fill="#b8ab95">THE THREE FORMS THAT KEEP SHOWING UP WRONG</text>
  <path d="M64 226h1152" stroke="#e7dcc4"/>
  <text x="64" y="262" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#8a7f6b">n % 100 &#8712; 3&#8230;10 &#8594; few</text>
  <text x="64" y="286" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#8a7f6b">n % 100 &#8712; 11&#8230;99 &#8594; many</text>
  <text x="1216" y="286" text-anchor="end" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#b8ab95">CLDR ar</text>

  <g>
    <rect x="640" y="50" width="576" height="210" rx="10" fill="#fffaf0" stroke="#eadfc8"/>

    <text x="960" y="96" text-anchor="start" direction="rtl" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="27" fill="#1c1917">&#1635; رسائل</text>
    <rect x="1000" y="74" width="180" height="30" rx="15" fill="#0f766e" fill-opacity="0.10" stroke="#0f766e" stroke-opacity="0.35"/>
    <text x="1090" y="94" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#0f766e">few</text>
    <path d="M672 116h508" stroke="#f0e6d2"/>

    <text x="960" y="152" text-anchor="start" direction="rtl" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="27" fill="#1c1917">&#1633;&#1633; رسالة</text>
    <rect x="1000" y="130" width="180" height="30" rx="15" fill="#0f766e" fill-opacity="0.10" stroke="#0f766e" stroke-opacity="0.35"/>
    <text x="1090" y="150" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#0f766e">many</text>
    <path d="M672 172h508" stroke="#f0e6d2"/>

    <text x="960" y="208" text-anchor="start" direction="rtl" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="27" fill="#1c1917">&#1633;&#1632;&#1632; رسالة</text>
    <rect x="1000" y="186" width="180" height="30" rx="15" fill="#8a7f6b" fill-opacity="0.10" stroke="#8a7f6b" stroke-opacity="0.4"/>
    <text x="1090" y="206" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#8a7f6b">other</text>

    <text x="672" y="242" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#b8ab95">ArabicPlural.format(templates, count:, locale:)</text>
  </g>
</svg>
